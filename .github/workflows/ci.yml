name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: CI
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate agent entrypoints
        shell: bash
        run: |
          test -f .agents/AGENTS.md
          test -L AGENTS.md
          test "$(readlink AGENTS.md)" = ".agents/AGENTS.md"
          test -L GEMINI.md
          test "$(readlink GEMINI.md)" = ".agents/AGENTS.md"
          test -L .claude/CLAUDE.md
          test "$(readlink .claude/CLAUDE.md)" = "../.agents/AGENTS.md"

      - name: Validate changed whitespace
        run: git diff-tree --check --root -r HEAD
