name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: CI
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate agent entrypoints
        shell: bash
        run: |
          test -f .agents/AGENTS.md
          test -L AGENTS.md
          test "$(readlink AGENTS.md)" = ".agents/AGENTS.md"
          test -L GEMINI.md
          test "$(readlink GEMINI.md)" = ".agents/AGENTS.md"
          test -L .claude/CLAUDE.md
          test "$(readlink .claude/CLAUDE.md)" = "../.agents/AGENTS.md"

      - name: Validate changed whitespace
        run: git diff-tree --check --root -r HEAD

      - name: Set up ARM64 emulation
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: docker.io/tonistiigi/binfmt:qemu-v10.2.3-68@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.37.1
          driver-opts: |
            image=docker.io/moby/buildkit:v0.33.0@sha256:6c2fa84a6b61ccd72899dde4239f8d5717f05f9a8ca6f3cad185fb1a95a94de3

      - name: Build and test all container images
        env:
          BUILD_REVISION: ${{ github.sha }}
          BUILD_VERSION: ci-${{ github.sha }}
        run: scripts/check.sh
