name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release target
        id: release
        shell: bash
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          python3 - "$GITHUB_REF_NAME" <<'PY'
          import re
          import sys
          import tomllib

          tag = sys.argv[1]
          if re.fullmatch(r"v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", tag) is None:
              raise SystemExit("release tag must be an exact semantic version")
          expected = tag[1:]
          manifests = (
              ("services/simulation-server/Cargo.toml", "package"),
              ("services/camera-edge-bridge/Cargo.toml", "package"),
              ("services/visualizer/pyproject.toml", "project"),
          )
          for path, table in manifests:
              with open(path, "rb") as source:
                  observed = tomllib.load(source)[table]["version"]
              if observed != expected:
                  raise SystemExit(f"{path} version {observed} differs from {expected}")
          PY
          version="${GITHUB_REF_NAME#v}"
          repository_owner="${GITHUB_REPOSITORY_OWNER,,}"
          {
            echo "version=$version"
            echo "server_image=ghcr.io/$repository_owner/scrap-monitoring-simulator-server"
            echo "visualizer_image=ghcr.io/$repository_owner/scrap-monitoring-simulator-visualizer"
            echo "edge_image=ghcr.io/$repository_owner/scrap-monitoring-simulator-camera-edge-bridge"
          } >> "$GITHUB_OUTPUT"

      - name: Set up ARM64 emulation
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: docker.io/tonistiigi/binfmt:qemu-v10.2.3-68@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.37.1
          driver-opts: |
            image=docker.io/moby/buildkit:v0.33.0@sha256:6c2fa84a6b61ccd72899dde4239f8d5717f05f9a8ca6f3cad185fb1a95a94de3

      - name: Validate release source
        env:
          BUILD_REVISION: ${{ github.sha }}
          BUILD_VERSION: ${{ steps.release.outputs.version }}
        run: scripts/check.sh

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish simulation server image
        id: server
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: services/simulation-server/Dockerfile
          target: runtime
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.release.outputs.server_image }}:${{ steps.release.outputs.version }}
            ${{ steps.release.outputs.server_image }}:sha-${{ github.sha }}
          build-args: |
            BUILD_REVISION=${{ github.sha }}
            BUILD_VERSION=${{ steps.release.outputs.version }}
          provenance: mode=max
          sbom: true

      - name: Publish visualizer image
        id: visualizer
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: services/visualizer/Dockerfile
          target: runtime
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.release.outputs.visualizer_image }}:${{ steps.release.outputs.version }}
            ${{ steps.release.outputs.visualizer_image }}:sha-${{ github.sha }}
          build-args: |
            BUILD_REVISION=${{ github.sha }}
            BUILD_VERSION=${{ steps.release.outputs.version }}
          provenance: mode=max
          sbom: true

      - name: Publish camera edge bridge image
        id: edge
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: services/camera-edge-bridge/Dockerfile
          target: runtime
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.release.outputs.edge_image }}:${{ steps.release.outputs.version }}
            ${{ steps.release.outputs.edge_image }}:sha-${{ github.sha }}
          build-args: |
            BUILD_REVISION=${{ github.sha }}
            BUILD_VERSION=${{ steps.release.outputs.version }}
          provenance: mode=max
          sbom: true

      - name: Create release inventory
        shell: bash
        env:
          EDGE_DIGEST: ${{ steps.edge.outputs.digest }}
          EDGE_IMAGE: ${{ steps.release.outputs.edge_image }}
          SERVER_DIGEST: ${{ steps.server.outputs.digest }}
          SERVER_IMAGE: ${{ steps.release.outputs.server_image }}
          VISUALIZER_DIGEST: ${{ steps.visualizer.outputs.digest }}
          VISUALIZER_IMAGE: ${{ steps.release.outputs.visualizer_image }}
        run: |
          mkdir -p dist
          printf '%s@%s\n%s@%s\n%s@%s\n' \
            "$SERVER_IMAGE" "$SERVER_DIGEST" \
            "$VISUALIZER_IMAGE" "$VISUALIZER_DIGEST" \
            "$EDGE_IMAGE" "$EDGE_DIGEST" \
            > dist/oci-images.txt
          grep -Eq '^ghcr\.io/.+@sha256:[0-9a-f]{64}$' dist/oci-images.txt
          test "$(wc -l < dist/oci-images.txt)" -eq 3

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/oci-images.txt
          fail_on_unmatched_files: true
          generate_release_notes: true
