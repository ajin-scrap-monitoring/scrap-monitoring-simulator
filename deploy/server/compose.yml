x-removed-environment-guards:
  lidar-1-port: "${SCRAP_SIMULATOR_LIDAR_1_PORT+${SCRAP_SIMULATOR_ACK_REMOVED_LIDAR_PORT_VARIABLES:?SCRAP_SIMULATOR_LIDAR_1_PORT is removed; use SCRAP_SIMULATOR_LIDAR_PORT}}"
  lidar-2-port: "${SCRAP_SIMULATOR_LIDAR_2_PORT+${SCRAP_SIMULATOR_ACK_REMOVED_LIDAR_PORT_VARIABLES:?SCRAP_SIMULATOR_LIDAR_2_PORT is removed; use SCRAP_SIMULATOR_LIDAR_PORT}}"

services:
  simulation-server:
    container_name: scrap-monitoring-simulator-server
    image: ${SCRAP_SIMULATION_SERVER_IMAGE:?release image digest is required}
    environment:
      SCRAP_SIMULATOR_SCENE_HOST: visualizer
      SCRAP_SIMULATOR_SCENE_PORT: "17000"
      SCRAP_SIMULATOR_MEAN_FILL_DURATION_S: ${SCRAP_SIMULATOR_MEAN_FILL_DURATION_S:-600}
      SCRAP_SIMULATOR_LIDAR_1_BIND: 0.0.0.0:8089
      SCRAP_SIMULATOR_LIDAR_2_BIND: 0.0.0.0:8090
    ports:
      - name: lidar-1
        host_ip: ${SCRAP_SIMULATOR_LIDAR_1_HOST:-127.0.0.2}
        target: 8089
        published: "${SCRAP_SIMULATOR_LIDAR_PORT:-8089}"
        protocol: udp
      - name: lidar-2
        host_ip: ${SCRAP_SIMULATOR_LIDAR_2_HOST:-127.0.0.3}
        target: 8090
        published: "${SCRAP_SIMULATOR_LIDAR_PORT:-8089}"
        protocol: udp
    depends_on:
      visualizer:
        condition: service_healthy
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    mem_limit: 512m
    cpus: 1.5
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    restart: unless-stopped
    stop_grace_period: 15s

  visualizer:
    container_name: scrap-monitoring-simulator-visualizer
    image: ${SCRAP_SIMULATOR_VISUALIZER_IMAGE:?release image digest is required}
    command:
      - live
    environment:
      SCRAP_MONITORING_VISUALIZER_TCP_HOST: 0.0.0.0
      SCRAP_MONITORING_VISUALIZER_TCP_PORT: "17000"
      SCRAP_MONITORING_VISUALIZER_HTTP_HOST: 0.0.0.0
      SCRAP_MONITORING_VISUALIZER_HTTP_PORT: "18000"
      SCRAP_MONITORING_VISUALIZER_CAMERA_ENABLED: "true"
      SCRAP_MONITORING_VISUALIZER_CAMERA_BACKEND: ${SCRAP_MONITORING_VISUALIZER_CAMERA_BACKEND:-osmesa}
    ports:
      - ${SCRAP_SIMULATOR_BROWSER_PORT:-18000}:18000/tcp
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=512m
    mem_limit: 3g
    cpus: 2.0
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    restart: unless-stopped
    stop_grace_period: 30s
