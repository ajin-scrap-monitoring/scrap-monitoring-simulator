[build-system]
requires = ["uv_build==0.12.13"]
build-backend = "uv_build"

[project]
name = "scrap-monitoring-visualizer"
version = "0.2.0"
description = "Headless renderer for Scrap Monitoring LiDAR scene frames"
requires-python = "==3.14.*"
dependencies = [
    "fastapi==0.141.1",
    "jsonschema==4.26.0",
    "numpy==2.5.3",
    "pillow==12.3.0",
    "pyvista==0.49.0",
    "vtk==9.7.0",
    "uvicorn==0.52.4",
    "websockets==17.1",
]

[project.scripts]
scrap-monitoring-visualizer = "scrap_monitoring_visualizer.cli:main"

[dependency-groups]
dev = [
    "mypy==2.3.1",
    "pytest==9.1.1",
    "ruff==0.16.6",
    "rumdl==0.2.70",
    "types-jsonschema==4.26.0.20260518",
]

[tool.uv]
required-version = "==0.12.13"

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "UP"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["vtk", "vtk.*"]
ignore_missing_imports = true
