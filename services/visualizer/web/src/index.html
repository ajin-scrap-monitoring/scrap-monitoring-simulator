<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Scrap Monitoring Simulator</title>
    <link rel="stylesheet" href="/style.css">
  </head>
  <body>
    <main>
      <section class="panels" aria-label="합성 시각화">
        <article>
          <h1>3D 적재 모델</h1>
          <canvas id="model-canvas" aria-label="3D 적재 모델"></canvas>
        </article>
        <article>
          <h1>합성 카메라</h1>
          <canvas id="camera-canvas" width="960" height="540" aria-label="합성 카메라 영상"></canvas>
        </article>
      </section>
      <section class="shared-stats" aria-label="공통 scene 수치">
        <dl><dt>주기</dt><dd id="cycle-value">-</dd></dl>
        <dl><dt>상태</dt><dd id="phase-value">-</dd></dl>
        <dl><dt>목표 적재율</dt><dd id="target-fill-value">-</dd></dl>
        <dl><dt>현재 적재율</dt><dd id="surface-fill-value">-</dd></dl>
        <dl><dt>적재량</dt><dd><span id="volume-value">-</span> m<sup>3</sup></dd></dl>
        <dl><dt>투입 지점</dt><dd id="inlet-value">-</dd></dl>
      </section>
    </main>
    <script type="module" src="/assets/main.js"></script>
  </body>
</html>
