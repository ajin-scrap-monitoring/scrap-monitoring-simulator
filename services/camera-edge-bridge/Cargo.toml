[package]
name = "scrap-synthetic-camera-bridge"
version = "0.3.2"
edition = "2024"
rust-version = "1.96"
description = "Bounded WebSocket to V4L2 bridge for the Scrap synthetic camera"
publish = false

[dependencies]
libc = "=0.2.175"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
signal-hook = "=0.3.18"
tungstenite = { version = "=0.28.0", default-features = false, features = ["handshake"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = "symbols"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "deny"
